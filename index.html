<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>SIGHT</title>
<style>
  :root{
    --bg: #05070a;
    --line: #1c2530;
    --cyan: #4fd8e0;
    --cyan-dim: #2a5a5e;
    --amber: #ffb454;
    --text: #dbe6ea;
    --text-dim: #5f7480;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', ui-monospace, monospace;
    overflow: hidden;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  #camWrap { position: absolute; inset: 0; background: #000; }
  #cam { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.9) contrast(1.05) brightness(0.95); }
  #canvas { display: none; }

  #freeze {
    position: absolute; inset: 0; z-index: 8;
    background: #000;
    display: none;
    align-items: center; justify-content: center;
  }
  #freeze.show { display: flex; }
  #freezeImg { max-width: 100%; max-height: 100%; display: block; }
  #objBox {
    position: absolute;
    border: 2px solid var(--cyan);
    box-shadow: 0 0 14px rgba(79,216,224,0.5);
    display: none;
    pointer-events: none;
  }
  #objLabel {
    position: absolute;
    background: rgba(5,7,10,0.9);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 6px 10px;
    font-size: 12px;
    line-height: 1.4;
    max-width: 240px;
    display: none;
    pointer-events: none;
  }
  #objLabel .oname { color: var(--cyan); font-weight: bold; letter-spacing: 0.05em; }
  #objLabel .ofunc { color: var(--text); font-size: 11px; display: block; margin-top: 2px; }
  #freezeClose {
    position: absolute; top: max(14px, env(safe-area-inset-top)); right: 14px; z-index: 9;
    display: none;
    background: rgba(5,7,10,0.85); border: 1px solid var(--line); color: var(--text-dim);
    font-family: inherit; font-size: 11px; letter-spacing: 0.1em;
    padding: 8px 12px; cursor: pointer;
  }
  #freeze.show ~ #freezeClose, #freezeClose.show { display: block; }

  #hudOverlay {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.65) 100%);
  }
  #scanline {
    position: absolute; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0; box-shadow: 0 0 12px 2px var(--cyan);
  }
  #scanline.active { animation: sweep 1.4s linear infinite; opacity: 0.9; }
  @keyframes sweep { 0% { top: 10%; } 50% { top: 88%; } 100% { top: 10%; } }

  .bracket { position: absolute; width: 28px; height: 28px; border: 2px solid var(--cyan-dim); opacity: 0.8; }
  .bracket.tl { top: 14px; left: 14px; border-right:none; border-bottom:none; }
  .bracket.tr { top: 14px; right: 14px; border-left:none; border-bottom:none; }
  .bracket.bl { bottom: 14px; left: 14px; border-right:none; border-top:none; }
  .bracket.br { bottom: 14px; right: 14px; border-left:none; border-top:none; }

  #statusBar {
    position: relative; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    padding: max(14px, env(safe-area-inset-top)) 18px 10px 18px;
    font-size: 11px; letter-spacing: 0.12em; color: var(--text-dim);
  }
  #statusBar .brand { color: var(--cyan); font-weight: bold; }
  #statusDot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-dim); margin-right: 6px; vertical-align: middle;
  }
  #statusDot.live { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  #statusDot.listening { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: pulse 1s infinite; }
  #statusDot.error { background: var(--danger); }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  #captionArea {
    position: relative; z-index: 5; margin-top: auto; padding: 0 16px 8px 16px;
    display: flex; flex-direction: column; gap: 8px; max-height: 32vh; overflow-y: auto;
  }
  .bubble {
    max-width: 92%; padding: 9px 13px; border-radius: 3px; font-size: 14px; line-height: 1.4;
    backdrop-filter: blur(6px); border: 1px solid var(--line);
  }
  .bubble.q { align-self: flex-end; background: rgba(79, 216, 224, 0.08); border-color: var(--cyan-dim); color: var(--cyan); }
  .bubble.a { align-self: flex-start; background: rgba(11, 15, 20, 0.85); border-color: var(--line); color: var(--text); }
  .bubble .tag { display: block; font-size: 9px; letter-spacing: 0.15em; color: var(--text-dim); margin-bottom: 3px; }
  .bubble.err { border-color: var(--danger); color: var(--danger); }

  #controlBar {
    position: relative; z-index: 6;
    display: flex; flex-direction: column; gap: 10px;
    padding: 10px 14px max(16px, env(safe-area-inset-bottom)) 14px;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
  }
  #typeRow { display: flex; align-items: center; gap: 8px; }
  #textInput {
    flex: 1;
    background: rgba(11,15,20,0.85);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 11px 12px;
    border-radius: 3px;
    outline: none;
  }
  #textInput:focus { border-color: var(--cyan-dim); }
  #sendBtn, #micBtn {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid var(--cyan-dim);
    background: rgba(79,216,224,0.06);
    color: var(--cyan);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    cursor: pointer;
  }
  #sendBtn:active, #micBtn:active { transform: scale(0.94); background: rgba(79,216,224,0.2); }
  #micBtn.listening { border-color: var(--amber); color: var(--amber); animation: pulse 1s infinite; }
  #micBtn.busy { pointer-events: none; opacity: 0.5; }
  #voiceHint {
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    min-height: 14px;
  }
  #voiceHint.err { color: var(--danger); }

  #startScreen {
    position: absolute; inset: 0; z-index: 20; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px;
  }
  #startScreen h1 { color: var(--cyan); font-size: 22px; letter-spacing: 0.3em; margin: 0 0 6px 0; font-weight: normal; }
  #startScreen p { color: var(--text-dim); font-size: 13px; line-height: 1.6; max-width: 320px; margin: 0 0 26px 0; }
  #startBtn {
    padding: 13px 34px; background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
    font-family: inherit; font-size: 13px; letter-spacing: 0.15em; cursor: pointer;
  }
  #startBtn:active { background: rgba(79,216,224,0.15); }
  #errMsg { margin-top: 18px; color: var(--danger); font-size: 12px; max-width: 300px; }
</style>
</head>
<body>
<div id="app">

  <div id="startScreen">
    <h1>S I G H T</h1>
    <p>Point your phone at something and ask about it &mdash; by voice or by typing.<br/>Each question uses well under 1MB.</p>
    <button id="startBtn">ACTIVATE</button>
    <div id="errMsg"></div>
  </div>

  <div id="camWrap">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="freeze">
    <img id="freezeImg" src="" alt="captured frame" />
    <div id="objBox"></div>
    <div id="objLabel"><span class="oname"></span><span class="ofunc"></span></div>
  </div>
  <button id="freezeClose">LIVE VIEW &#10005;</button>

  <div id="hudOverlay">
    <div class="bracket tl"></div>
    <div class="bracket tr"></div>
    <div class="bracket bl"></div>
    <div class="bracket br"></div>
    <div id="scanline"></div>
  </div>

  <div id="statusBar">
    <span><span id="statusDot"></span><span class="brand">SIGHT</span></span>
    <span id="statusText">IDLE</span>
  </div>

  <div id="captionArea"></div>

  <div id="controlBar">
    <div id="voiceHint">TYPE A QUESTION, OR TAP THE MIC</div>
    <div id="typeRow">
      <input id="textInput" type="text" placeholder="Ask about what you see..." autocomplete="off" autocorrect="off" />
      <div id="sendBtn">&#8593;</div>
      <div id="micBtn">&#9679;</div>
    </div>
  </div>

</div>

<script>
(function(){
  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');
  const errMsg = document.getElementById('errMsg');
  const cam = document.getElementById('cam');
  const canvas = document.getElementById('canvas');
  const micBtn = document.getElementById('micBtn');
  const sendBtn = document.getElementById('sendBtn');
  const textInput = document.getElementById('textInput');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const scanline = document.getElementById('scanline');
  const captionArea = document.getElementById('captionArea');
  const voiceHint = document.getElementById('voiceHint');
  const freeze = document.getElementById('freeze');
  const freezeImg = document.getElementById('freezeImg');
  const freezeClose = document.getElementById('freezeClose');
  const objBox = document.getElementById('objBox');
  const objLabel = document.getElementById('objLabel');

  let recognition = null;
  let recognizing = false;
  let recogTimeout = null;
  let camStream = null;
  let busy = false;

  function setStatus(mode, label){
    statusDot.className = mode || '';
    statusText.textContent = label || 'IDLE';
  }

  function setVoiceHint(text, isErr){
    voiceHint.textContent = text;
    voiceHint.className = isErr ? 'err' : '';
  }

  function addBubble(kind, text){
    const b = document.createElement('div');
    b.className = 'bubble ' + kind;
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = kind === 'q' ? 'YOU ASKED' : (kind === 'err' ? 'ISSUE' : 'SIGHT');
    b.appendChild(tag);
    const body = document.createElement('div');
    body.textContent = text;
    b.appendChild(body);
    captionArea.appendChild(b);
    captionArea.scrollTop = captionArea.scrollHeight;
    while (captionArea.children.length > 6) {
      captionArea.removeChild(captionArea.firstChild);
    }
  }

  async function startCamera(){
    let combined;
    try {
      combined = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: true
      });
    } catch (e) {
      combined = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      });
    }
    camStream = combined;
    cam.srcObject = combined;
    await cam.play();
    combined.getAudioTracks().forEach(t => t.stop());
  }

  function captureFrameDataUrl(){
    const w = cam.videoWidth || 640;
    const h = cam.videoHeight || 480;
    const maxDim = 640;
    const scale = Math.min(1, maxDim / Math.max(w, h));
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    const ctx = canvas.getContext('2d');
    ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.6);
  }

  function speak(text){
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 1.02;
      utter.pitch = 1.0;
      window.speechSynthesis.speak(utter);
    } catch(e){}
  }

  function positionObjectBox(box){
    const rect = freezeImg.getBoundingClientRect();
    const wrapRect = freeze.getBoundingClientRect();
    const left = rect.left - wrapRect.left;
    const top = rect.top - wrapRect.top;
    const bx = left + box.x * rect.width;
    const by = top + box.y * rect.height;
    const bw = Math.max(20, box.w * rect.width);
    const bh = Math.max(20, box.h * rect.height);

    objBox.style.left = bx + 'px';
    objBox.style.top = by + 'px';
    objBox.style.width = bw + 'px';
    objBox.style.height = bh + 'px';
    objBox.style.display = 'block';

    objLabel.style.left = bx + 'px';
    const labelTop = (by - 54) > 0 ? (by - 54) : (by + 4);
    objLabel.style.top = labelTop + 'px';
    objLabel.style.display = 'block';
  }

  function showFreeze(dataUrl, objectInfo){
    freezeImg.src = dataUrl;
    freeze.classList.add('show');
    freezeClose.classList.add('show');
    objBox.style.display = 'none';
    objLabel.style.display = 'none';

    const render = () => {
      if (objectInfo && objectInfo.box) {
        objLabel.querySelector('.oname').textContent = objectInfo.name || 'Object';
        objLabel.querySelector('.ofunc').textContent = objectInfo.function || '';
        positionObjectBox(objectInfo.box);
      }
    };
    if (freezeImg.complete) render();
    else freezeImg.onload = render;
  }

  function hideFreeze(){
    freeze.classList.remove('show');
    freezeClose.classList.remove('show');
    objBox.style.display = 'none';
    objLabel.style.display = 'none';
  }

  freezeClose.addEventListener('click', hideFreeze);

  async function askClaude(question, imageB64DataUrl){
    const imageB64 = imageB64DataUrl.split(',')[1];
    const body = {
      model: "claude-sonnet-4-6",
      max_tokens: 700,
      messages: [
        {
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: "image/jpeg", data: imageB64 } },
            { type: "text", text:
              "You are a spoken visual assistant, like Jarvis. The user is looking through a camera and asked: \"" +
              question +
              "\". Respond with ONLY raw JSON, no markdown fences, no extra commentary, matching exactly this shape: " +
              '{"answer": "1-3 sentence conversational spoken answer to their question", "object": {"name": "short name of the single most relevant object in the image related to the question", "function": "one short sentence on what it is or what it does", "box": {"x": 0.0, "y": 0.0, "w": 0.0, "h": 0.0}}}' +
              " The box fields are your best-estimate fractions (0 to 1) of the image width/height for that object's bounding box, x/y being the top-left corner. If no single object is clearly relevant, still give your best guess."
            }
          ]
        }
      ]
    };

    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      throw new Error("Request failed: " + res.status);
    }
    const data = await res.json();
    const textBlock = (data.content || []).find(c => c.type === 'text');
    if (!textBlock) throw new Error("No response content");
    const clean = textBlock.text.replace(/```json|```/g, '').trim();
    return JSON.parse(clean);
  }

  async function runPipeline(question){
    if (busy) return;
    busy = true;
    addBubble('q', question);
    setStatus('listening', 'THINKING');
    scanline.classList.add('active');
    micBtn.classList.add('busy');
    sendBtn.style.pointerEvents = 'none';

    try {
      const dataUrl = captureFrameDataUrl();
      const parsed = await askClaude(question, dataUrl);
      addBubble('a', parsed.answer || "I'm not sure — try asking again.");
      speak(parsed.answer || '');
      showFreeze(dataUrl, parsed.object);
      setStatus('live', 'READY');
    } catch(err) {
      addBubble('err', 'Something went wrong reaching the assistant. Try again.');
      setStatus('error', 'ERROR');
      setTimeout(() => setStatus('live', 'READY'), 1500);
    } finally {
      scanline.classList.remove('active');
      micBtn.classList.remove('busy');
      sendBtn.style.pointerEvents = 'auto';
      busy = false;
    }
  }

  function submitTyped(){
    const q = textInput.value.trim();
    if (!q) return;
    hideFreeze();
    textInput.value = '';
    textInput.blur();
    runPipeline(q);
  }
  sendBtn.addEventListener('click', submitTyped);
  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitTyped();
  });

  function getSR(){ return window.SpeechRecognition || window.webkitSpeechRecognition; }

  function voiceErrorMessage(errorCode){
    switch(errorCode){
      case 'not-allowed':
      case 'service-not-allowed':
        return 'Mic blocked — enable it in Safari settings, or just type below.';
      case 'no-speech':
        return "Didn't catch that — try again or type below.";
      case 'network':
        return 'Voice service unavailable — type your question below.';
      case 'aborted':
        return '';
      default:
        return 'Voice input not working here — type below instead.';
    }
  }

  function startVoice(){
    if (busy || recognizing) return;
    const SR = getSR();
    if (!SR) {
      setVoiceHint('Voice not supported on this browser — type your question below.', true);
      textInput.focus();
      return;
    }

    hideFreeze();
    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognizing = true;
    micBtn.classList.add('listening');
    setStatus('listening', 'LISTENING');
    setVoiceHint('LISTENING...', false);

    recogTimeout = setTimeout(() => {
      if (recognizing) {
        try { recognition.abort(); } catch(e){}
      }
    }, 8000);

    recognition.onresult = (e) => {
      const q = e.results[0][0].transcript;
      textInput.value = q;
      setVoiceHint('TYPE A QUESTION, OR TAP THE MIC', false);
      runPipeline(q);
    };
    recognition.onerror = (e) => {
      const msg = voiceErrorMessage(e.error);
      if (msg) setVoiceHint(msg, true);
      else setVoiceHint('TYPE A QUESTION, OR TAP THE MIC', false);
    };
    recognition.onend = () => {
      recognizing = false;
      micBtn.classList.remove('listening');
      clearTimeout(recogTimeout);
      setStatus('live', 'READY');
    };

    try {
      recognition.start();
    } catch(e) {
      recognizing = false;
      micBtn.classList.remove('listening');
      setVoiceHint('Voice input failed to start — type below instead.', true);
    }
  }

  micBtn.addEventListener('click', startVoice);

  startBtn.addEventListener('click', async () => {
    try {
      await startCamera();
      startScreen.style.display = 'none';
      setStatus('live', 'READY');
    } catch(e) {
      errMsg.textContent = 'Could not access camera: ' + e.message + '. Check browser permissions.';
    }
  });
})();
</script>
</body>
</html>
